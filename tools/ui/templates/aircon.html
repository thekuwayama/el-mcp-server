<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>エアコンダッシュボード</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #eaeaea; }
  }
  .card {
    border: 1px solid rgba(128,128,128,0.3);
    border-radius: 12px;
    padding: 16px;
  }
  .title { font-size: 14px; opacity: 0.7; margin-bottom: 12px; }
  .rows { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 13px; align-items: center; }
  .rows dt { opacity: 0.7; }
  .rows dd { margin: 0; font-weight: 600; text-align: right; }
  .empty { opacity: 0.6; font-size: 13px; }

  .toggle {
    font: inherit;
    font-weight: 600;
    padding: 3px 12px;
    border-radius: 999px;
    border: 1px solid rgba(128,128,128,0.4);
    background: rgba(128,128,128,0.12);
    color: inherit;
    cursor: pointer;
  }
  .toggle[data-on="true"] {
    border-color: #2e7d32;
    background: rgba(46,125,50,0.15);
    color: #2e7d32;
  }
  .toggle:disabled, select:disabled, .stepper button:disabled { opacity: 0.5; cursor: default; }
  .toggle:focus-visible, select:focus-visible, .stepper button:focus-visible { outline: 2px solid #2e7d32; outline-offset: 2px; }

  select {
    font: inherit;
    font-weight: 600;
    color: inherit;
    background: rgba(128,128,128,0.12);
    border: 1px solid rgba(128,128,128,0.4);
    border-radius: 6px;
    padding: 3px 6px;
  }

  .stepper { display: inline-flex; align-items: center; gap: 8px; }
  .stepper button {
    font: inherit;
    font-weight: 600;
    color: inherit;
    background: rgba(128,128,128,0.12);
    border: 1px solid rgba(128,128,128,0.4);
    border-radius: 6px;
    width: 24px;
    height: 24px;
    cursor: pointer;
  }
  .stepper .value { min-width: 3em; text-align: center; }

  .error {
    margin-top: 10px;
    font-size: 12px;
    color: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    .error { color: #ef9a9a; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="title" id="heading">エアコン 読み込み中…</div>
  <dl class="rows" id="rows">
    <dt>状態</dt>
    <dd><button type="button" id="btn-status" class="toggle" disabled>-</button></dd>
    <dt>運転モード</dt>
    <dd>
      <select id="sel-mode" disabled>
        <option value="">-</option>
      </select>
    </dd>
    <dt>設定温度</dt>
    <dd>
      <span class="stepper">
        <button type="button" id="btn-temp-down" disabled>-</button>
        <span class="value" id="v-target-temp">-</span>
        <button type="button" id="btn-temp-up" disabled>+</button>
      </span>
    </dd>
    <dt>室内温度</dt><dd id="v-room-temp">-</dd>
    <dt>風量</dt>
    <dd>
      <select id="sel-fan" disabled>
        <option value="">-</option>
      </select>
    </dd>
  </dl>
  <div class="empty" id="empty" hidden>この機器からは表示可能な情報が取得できませんでした。</div>
  <div class="error" id="error" hidden></div>
</div>
<script>
(function () {
  var nextId = 1;
  var pending = {};
  var current = null; // last rendered airconUIState (ip/eoj carried for control actions)

  // Mirrors tools/ui/aircon_decode.go airconOperationModeNames — keep in sync.
  var OPERATION_MODES = [
    ["40", "その他"],
    ["41", "自動"],
    ["42", "冷房"],
    ["43", "暖房"],
    ["44", "除湿"],
    ["45", "送風"]
  ];

  // Mirrors tools/ui/aircon_decode.go DecodeAirFlowLevel (0x31-0x38 = levels 1-8, 0x41 = auto).
  var FAN_LEVELS = [
    ["41", "自動"],
    ["31", "風量1"],
    ["32", "風量2"],
    ["33", "風量3"],
    ["34", "風量4"],
    ["35", "風量5"],
    ["36", "風量6"],
    ["37", "風量7"],
    ["38", "風量8"]
  ];

  var MIN_TEMP = 0;
  var MAX_TEMP = 50;

  var btnStatus = document.getElementById("btn-status");
  var selMode = document.getElementById("sel-mode");
  var selFan = document.getElementById("sel-fan");
  var btnTempDown = document.getElementById("btn-temp-down");
  var btnTempUp = document.getElementById("btn-temp-up");
  var errorEl = document.getElementById("error");

  OPERATION_MODES.forEach(function (entry) {
    var opt = document.createElement("option");
    opt.value = entry[0];
    opt.textContent = entry[1];
    selMode.appendChild(opt);
  });

  FAN_LEVELS.forEach(function (entry) {
    var opt = document.createElement("option");
    opt.value = entry[0];
    opt.textContent = entry[1];
    selFan.appendChild(opt);
  });

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    if (msg.id !== undefined && pending[msg.id]) {
      var cb = pending[msg.id];
      delete pending[msg.id];
      if (msg.error) cb.reject(msg.error);
      else cb.resolve(msg.result);
      return;
    }

    if (msg.method === "ui/notifications/tool-result") {
      render(msg.params && msg.params.structuredContent);
    }
  });

  // timeoutMs is optional. Without it a silent host leaves the promise pending
  // forever, which also means the caller's .catch() fallback never runs.
  function sendRequest(method, params, timeoutMs) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      var timer = null;
      function settle(fn) {
        return function (v) {
          if (timer) clearTimeout(timer);
          fn(v);
        };
      }
      pending[id] = { resolve: settle(resolve), reject: settle(reject) };
      if (timeoutMs) {
        timer = setTimeout(function () {
          delete pending[id];
          reject(new Error(method + " timed out after " + timeoutMs + "ms"));
        }, timeoutMs);
      }
      window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params }, "*");
    });
  }

  function callTool(name, args) {
    return sendRequest("tools/call", { name: name, arguments: args }).then(function (result) {
      if (result && result.isError) {
        var text = (result.content || []).map(function (c) { return c.text; }).filter(Boolean).join(" ");
        throw new Error(text || (name + " failed"));
      }
      return result;
    });
  }

  function showError(err) {
    errorEl.textContent = (err && err.message) || String(err);
    errorEl.hidden = false;
  }

  function clearError() {
    errorEl.hidden = true;
    errorEl.textContent = "";
  }

  function setControlsEnabled(enabled) {
    btnStatus.disabled = !enabled;
    selMode.disabled = !enabled;
    selFan.disabled = !enabled;
    btnTempDown.disabled = !enabled;
    btnTempUp.disabled = !enabled;
  }

  function applyProperty(epc, edt) {
    if (!current || !current.ip || !current.eoj) return;
    clearError();
    setControlsEnabled(false);

    callTool("set_property", { ip: current.ip, eoj: current.eoj, epc: epc, edt: edt })
      .then(function () {
        return callTool("render_aircon_ui", { ip: current.ip, eoj: current.eoj });
      })
      .then(function (result) {
        render(result && result.structuredContent);
      })
      .catch(function (err) {
        showError(err);
        setControlsEnabled(true);
      });
  }

  btnStatus.addEventListener("click", function () {
    var turningOn = btnStatus.dataset.on !== "true";
    applyProperty("80", turningOn ? "30" : "31");
  });

  selMode.addEventListener("change", function () {
    if (!selMode.value) return;
    applyProperty("B0", selMode.value);
  });

  selFan.addEventListener("change", function () {
    if (!selFan.value) return;
    applyProperty("A0", selFan.value);
  });

  function stepTemperature(delta) {
    if (!current || typeof current.target_temperature !== "number") return;
    var next = current.target_temperature + delta;
    if (next < MIN_TEMP || next > MAX_TEMP) return;
    var hex = next.toString(16).toUpperCase();
    if (hex.length < 2) hex = "0" + hex;
    applyProperty("B3", hex);
  }

  btnTempDown.addEventListener("click", function () { stepTemperature(-1); });
  btnTempUp.addEventListener("click", function () { stepTemperature(1); });

  function render(state) {
    if (!state) return;
    current = state;
    document.getElementById("empty").hidden = true;

    var heading = "エアコン";
    if (state.ip) heading += " (" + state.ip + ")";
    document.getElementById("heading").textContent = heading;

    var hasDevice = !!(state.ip && state.eoj);

    var isOn = state.operating_status === "稼働中";
    btnStatus.textContent = state.operating_status || "不明";
    btnStatus.dataset.on = String(isOn);
    btnStatus.disabled = !hasDevice;

    var modeEntry = OPERATION_MODES.filter(function (e) { return state.operation_mode === e[1]; })[0];
    selMode.value = modeEntry ? modeEntry[0] : "";
    selMode.disabled = !hasDevice;

    var fanEntry = FAN_LEVELS.filter(function (e) { return state.air_flow_level === e[1]; })[0];
    selFan.value = fanEntry ? fanEntry[0] : "";
    selFan.disabled = !hasDevice;

    if (typeof state.target_temperature === "number") {
      document.getElementById("v-target-temp").textContent = state.target_temperature + " ℃";
      btnTempDown.disabled = !hasDevice || state.target_temperature <= MIN_TEMP;
      btnTempUp.disabled = !hasDevice || state.target_temperature >= MAX_TEMP;
    } else {
      document.getElementById("v-target-temp").textContent = "不明";
      btnTempDown.disabled = true;
      btnTempUp.disabled = true;
    }

    if (typeof state.room_temperature === "number") {
      document.getElementById("v-room-temp").textContent = state.room_temperature + " ℃";
    } else {
      document.getElementById("v-room-temp").textContent = "不明";
    }
  }

  function sendNotification(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method: method, params: params }, "*");
  }

  // Dimensions the host pinned itself. Reporting these back is pointless, and
  // measuring them is actively wrong: applyContainerDimensions sets the fixed
  // axis to 100vw/100vh, so scrollWidth/scrollHeight would return the viewport
  // size rather than the content size.
  var hostFixedWidth = false;
  var hostFixedHeight = false;
  var sizeReportingStarted = false;

  // Flexible views must report their content size; otherwise the host has no
  // dimensions to apply and the iframe stays collapsed.
  function startSizeReporting() {
    if (sizeReportingStarted) return;
    sizeReportingStarted = true;
    if (hostFixedWidth && hostFixedHeight) return;

    var lastH = -1, lastW = -1;
    function report() {
      var el = document.documentElement;
      var h = hostFixedHeight ? null : Math.ceil(el.scrollHeight);
      var w = hostFixedWidth ? null : Math.ceil(el.scrollWidth);
      if (h === lastH && w === lastW) return;
      lastH = h; lastW = w;
      // Omitted axes are left untouched by the host.
      var params = {};
      if (w !== null) params.width = w;
      if (h !== null) params.height = h;
      sendNotification("ui/notifications/size-changed", params);
    }
    report();
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(report).observe(document.body);
    } else {
      setInterval(report, 500);
    }
  }

  function applyContainerDimensions(hostContext) {
    var d = hostContext && hostContext.containerDimensions;
    if (!d) return;
    var el = document.documentElement;
    if ("height" in d) { el.style.height = "100vh"; hostFixedHeight = true; }
    else if (d.maxHeight) el.style.maxHeight = d.maxHeight + "px";
    if ("width" in d) { el.style.width = "100vw"; hostFixedWidth = true; }
    else if (d.maxWidth) el.style.maxWidth = d.maxWidth + "px";
  }

  var INITIALIZE_TIMEOUT_MS = 2000;

  sendRequest("ui/initialize", {
    appCapabilities: { availableDisplayModes: ["inline"] },
    clientInfo: { name: "el-mcp-server-aircon-ui", version: "0.1.0" },
    protocolVersion: "2026-01-26"
  }, INITIALIZE_TIMEOUT_MS).then(function (result) {
    applyContainerDimensions(result && result.hostContext);
    // Required by SEP-1865: the host MUST NOT send any request or
    // notification (including ui/notifications/tool-result) to the view
    // before it receives this notification.
    sendNotification("ui/notifications/initialized", {});
    startSizeReporting();
  }).catch(function () {
    // Reached when the host rejects the handshake or stays silent past the
    // timeout. Report size anyway so a non-conforming host still gets usable
    // dimensions instead of a collapsed iframe.
    startSizeReporting();
  });
})();
</script>
</body>
</html>
