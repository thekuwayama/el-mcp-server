name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: check gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "$diff"
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

      - run: go build -o el-mcp-server .

      - run: go build ./cmd/update-mra ./cmd/gen-manufacturers ./cmd/gen-mcpb-manifest
