name: Generated files are up to date

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Regenerate generated files
        run: make generate

      # does nothing when there is no diff; force-pushes and updates the PR if one is already open
      - name: Create pull request if generated files changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: bot/update-generated-files
          delete-branch: true
          add-paths: |
            echonet/spec/manufacturers/
            echonet/spec/mra/
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "chore: 生成ファイルを最新版に更新する"
          title: "chore: 生成ファイルを最新版に更新する"
          body-path: .github/PULL_REQUEST_TEMPLATE/update-generated-files.md
