name: release mcpb

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: determine release version (JST date)
        run: echo "VERSION=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_ENV"

      - run: make mcpb

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" mcpb/el-mcp-server.mcpb \
            --title "el-mcp-server mcpb $VERSION" \
            --generate-notes
